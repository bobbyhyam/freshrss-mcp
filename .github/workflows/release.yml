# Fork: upstream's release workflow also published the npm package and the MCP
# Registry entry. Both are gone here. We have no publish rights on
# `@ni-c/freshrss-mcp` and no wish to shadow it, and the registry entry names
# upstream's server. What is left is the tag gate and the GitHub release; the
# container image is built and pushed by ci.yml, which triggers on the same tag.
name: Release

on:
  push:
    # Widened from upstream's 'v*.*.*': our tags carry a fork suffix,
    # `v0.3.0-bh.1` and so on.
    tags: ['v*']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm run test:coverage

  github-release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # `--generate-notes` compares against the previous tag, which a
          # shallow clone does not have.
          fetch-depth: 0
      - name: Extract release notes from CHANGELOG
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v ver="$version" \
            '$0 ~ "^## \\[" ver "\\]" {flag=1; next} /^## \[/ {flag=0} flag' \
            CHANGELOG.md > release-notes.md
      # Upstream failed the job when the CHANGELOG had no section for the tag.
      # Here a fork tag routinely has none — `v0.3.0-bh.1` is upstream's 0.3.0
      # plus our transport — so an absent section falls back to generated notes
      # rather than blocking the release.
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -s release-notes.md ]; then
            gh release create "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --notes-file release-notes.md
          else
            echo "No CHANGELOG section for $GITHUB_REF_NAME — generating notes"
            gh release create "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --generate-notes
          fi
